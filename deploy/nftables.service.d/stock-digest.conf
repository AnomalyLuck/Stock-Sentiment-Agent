# Installed by stages/StockDigest.sh to /etc/systemd/system/nftables.service.d/stock-digest.conf.
# The baseline ruleset reloads with TcpOK = { 22 } (B-7), so the web ports the stage added would
# vanish at the next boot. After every start, stock-digest-ports puts them back. It holds the port
# list, adds set elements only and never edits the ruleset (UD-14, UD-31). See adr/ADR-0006.
# `systemctl reload nftables` does not run ExecStartPost; after a reload, run stock-digest-ports
# or stock-digest-activate to repair the set.
[Service]
ExecStartPost=/usr/local/sbin/stock-digest-ports
