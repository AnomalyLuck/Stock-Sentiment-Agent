[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stock-digest"
version = "0.1.0"
description = "A source-checked, single-stock terminal digest"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.22.3,<0.23",
  "pydantic>=2.13,<3",
  "rich>=14,<16",
  "httpx>=0.28,<0.29",
  "exchange-calendars>=4.13,<5",
  "python-dotenv>=1,<2",
  "yfinance>=1.7,<1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
stock-digest = "stock_digest.__main__:main"
material-news = "stock_digest.material.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["stock_digest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
